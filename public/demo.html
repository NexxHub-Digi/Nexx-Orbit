ight:8px;border-radius:8px;background:#263349;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8e72ff,#59d6cc);border-radius:8px}.flow-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.canvas-scroll{overflow:auto;background-color:#0d1521;background-image:radial-gradient(#31405c 1px,transparent 1px);background-size:22px 22px;min-height:570px;max-width:100%;border-radius:0 0 14px 14px}.canvas{width:1370px;height:550px;position:relative;touch-action:pan-x pan-y}.wires{position:absolute;inset:0;pointer-events:none}.node{position:absolute;width:190px;min-height:110px;background:#1a2437;border:1px solid #41516b;border-radius:13px;box-shadow:0 15px 24px #0004;cursor:grab;user-select:none;padding:13px}.node:active{cursor:grabbing}.node.selected{border-color:#b59eff;box-shadow:0 0 0 3px #9c82ff22,0 15px 25px #0006}.node-type{text-transform:uppercase;font-size:9px;letter-spacing:1.3px;font-weight:800;color:#9f8bff;display:flex;align-items:center;gap:7px}.node-type span{font-size:14px}.node strong{display:block;font-size:12px;margin:11px 0 2px}.node p{font-size:10px;color:#9cabc4;margin:0;line-height:1.4}.node:before,.node:after{content:'';position:absolute;top:48px;height:10px;width:10px;border:2px solid #96b0d8;background:#172235;border-radius:50%}.node:before{left:-6px}.node:after{right:-6px}.node.trigger{border-color:#4a6480}.node.approval{border-color:#7a6043}.node.approval .node-type{color:#edc875}.node.action .node-type{color:#6fddc8}.inspector{padding:20px}.inspector h3{margin:6px 0;font-size:18px}.field{display:grid;gap:6px;margin:16px 0}.field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#93a2be;font-weight:750}.field input,.field select{width:100%;background:#0e1623;color:#e5ebf8;border:1px solid #334159;padding:10px 11px;border-radius:8px;min-width:0}.notice{border:1px solid #42446a;background:#22233d;color:#c6c4ff;padding:11px;border-radius:10px;font-size:11px;margin-top:13px}.list-check{display:flex;gap:9px;align-items:center;color:#b3bfd3;font-size:12px;margin:10px 0}.list-check input{accent-color:#9076ff}.agent-card{padding:20px}.avatar{display:grid;place-items:center;width:43px;height:43px;border:1px solid #594a8e;border-radius:12px;background:#302747;color:#c8b3ff;font-size:22px}.agent-card h3{margin:12px 0 4px;font-size:16px}.agent-card p{font-size:12px;color:#95a2bb;min-height:35px}.divider{border:0;border-top:1px solid #27334a;margin:17px 0}.cards-lines{display:grid;gap:8px}.cards-lines .mini{display:flex;justify-content:space-between;color:#94a4bd}.cards-lines strong{color:#d9e2f6}.switch{display:inline-block;width:37px;height:21px;background:#43516a;border-radius:25px;position:relative;vertical-align:middle}.switch:after{content:'';position:absolute;top:3px;left:3px;height:15px;width:15px;background:#ddd;border-radius:50%;transition:.15s}.switch.on{background:#7562e5}.switch.on:after{left:19px}.switchbtn{border:0;background:transparent;padding:5px}.integration-icon{width:40px;height:40px;border-radius:12px;background:#24304a;display:grid;place-items:center;color:#b5c7ff;font-size:20px}.alert{padding:13px 16px;border:1px solid #524b38;background:#2c291d;color:#e5d0a1;border-radius:10px;font-size:12px}.code{font:12px/1.6 'Consolas',monospace;background:#070e17;border:1px solid #28364d;border-radius:10px;padding:15px;white-space:pre-wrap;overflow:auto;color:#a9c8dd}.modal-backdrop{position:fixed;inset:0;background:#03070cca;z-index:90;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}.modal{max-width:500px;width:100%;background:#141e2c;border:1px solid #49546e;border-radius:17px;padding:24px;box-shadow:0 30px 90px #000c}.modal h2{margin:0 0 8px;font-size:21px}.modal p{margin:0 0 19px;color:#9cacc6;font-size:12px}.modal .buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.toast{position:fixed;bottom:25px;right:25px;max-width:370px;z-index:100;background:#24314a;border:1px solid #6f79a1;color:#f1f6ff;border-radius:12px;padding:14px 17px;box-shadow:0 20px 60px #0009;font-size:12px;display:none}.audit-icon{color:var(--cyan)}.empty{padding:30px 20px;color:#8d9eb7;text-align:center}.page-footer{margin-top:25px;font-size:11px;color:#6f819e;text-align:center}.tenant-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #4c416d;background:#25203a;border-radius:10px;padding:5px 9px;color:#c5b9ff;font-size:11px;font-weight:750}.svg-arrow{stroke:#637bb9;stroke-width:2.5;fill:none;stroke-dasharray:5 4}.topbar .mobmenu{display:none}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.radios{display:flex;gap:10px;flex-wrap:wrap}.radios label{display:flex;gap:5px;align-items:center;font-size:12px;color:#b2bfda}.radios input{accent-color:#8c74ff}.check-badge{display:inline-flex;gap:5px;align-items:center;color:#7be4bd;font-size:11px}.nowrap{white-space:nowrap}
@media(max-width:1250px){.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-layout{grid-template-columns:1fr}.inspector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.inspector h3,.inspector .notice,.inspector .section-sub{grid-column:1/-1}.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:60;top:0;bottom:0;width:248px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0);box-shadow:30px 0 80px #000b}.topbar .mobmenu{display:inline-block}.topbar{padding:0 15px}.top-right{gap:6px}.role{display:none}.select{min-width:110px;width:155px}.content{padding:20px 15px 55px}.heading h1{font-size:24px}}

<body>
<div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const uid=()=>Math.random().toString(36).slice(2,9);
const createNodes=()=>[{id:uid(),x:45,y:182,type:'trigger',name:'New request',detail:'Webhook / scheduler'},{id:uid(),x:290,y:182,type:'agent',name:'Planner Agent',detail:'Plan and delegate'},{id:uid(),x:535,y:182,type:'model',name:'Model Router',detail:'Cost-aware inference'},{id:uid(),x:780,y:182,type:'approval',name:'Human approval',detail:'Approve risky actions'},{id:uid(),x:1025,y:182,type:'action',name:'Execute & notify',detail:'Tools + outcome'}];
function seedFlow(id,name,description,status='active'){return {id,name,description,status,nodes:createNodes(),updated:'Now',runs:0,needsApproval:true};}
const tenants=[
{id:'nexx',name:'Nexx AI',slug:'nexx-ai',plan:'Scale',users:12,budget:600,used:247,agents:[{id:'a1',name:'Executive Planner',type:'Planner',model:'GPT-6',desc:'Decomposes objectives into traceable tasks.'},{id:'a2',name:'Research Analyst',type:'Research',model:'DeepSeek',desc:'Retrieves evidence and evaluates sources.'},{id:'a3',name:'Tool Operator',type:'Action',model:'Qwen',desc:'Executes approved tools and reports outcomes.'}],flows:[seedFlow('f1','Intelligence Research','Plan → research → verify → publish'),seedFlow('f2','Product Release Guard','Tests and approval before release','draft'),seedFlow('f3','Customer Support Triaging','Route customer requests to agents')],integrations:{GitHub:true,Neon:true,Vercel:true,'Google Drive':false,'MCP Server':true,'Webhooks':true},runs:[],audit:[]},
{id:'eventpass',name:'EventPass Studio',slug:'eventpass-studio',plan:'Growth',users:6,budget:200,used:78,agents:[{id:'b1',name:'Ticket Analyst',type:'Analysis',model:'GPT-6',desc:'Reviews support and ticketing insights.'}],flows:[seedFlow('f4','Event Ops Triage','Event operations monitoring'),seedFlow('f5','Gate Incident Review','Diagnose gate events','draft')],integrations:{GitHub:true,Neon:false,Vercel:false,'Google Drive':false,'MCP Server':false,'Webhooks':true},runs:[],audit:[]},
{id:'hotel',name:'Hotel Ops Lab',slug:'hotel-ops-lab',plan:'Starter',users:4,budget:100,used:32,agents:[{id:'c1',name:'Operations Assistant',type:'Operations',model:'Qwen',desc:'Runs operational diagnostics.'}],flows:[seedFlow('f6','Room Availability Sync','Reconcile room inventory')],integrations:{GitHub:false,Neon:false,Vercel:false,'Google Drive':true,'MCP Server':false,'Webhooks':false},runs:[],audit:[]}
];
const state={tenant:'nexx',role:'owner',page:'overview',selectedFlow:'f1',selectedNode:0,selectedRun:null,modal:null,search:'',dryRun:true,mobileMenu:false};
const pages=[['overview','◫','Overview'],['studio','⬡','Workflow Studio'],['agents','✳','Agent Studio'],['runs','◎','Executions'],['integrations','⤴','Integrations'],['billing','◉','Usage & Billing'],['security','◇','Security & Access'],['audit','≡','Audit Trail'],['tenants','▦','Platform Tenants']];
const byId=id=>tenants.find(t=>t.id===id);const tenant=()=>byId(state.tenant);
const clean=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const isOwner=()=>state.role==='owner';const canEdit=()=>state.role!=='viewer';const canGovern=()=>['owner','admin'].includes(state.role);
const money=n=>'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
function log(message,resource='workspace',t=tenant()){t.audit.unshift({at:new Date().toLocaleTimeString(),actor:state.role,resource,message});t.audit=t.audit.slice(0,30);}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.style.display='none',3500);}
function badge(status){let s=String(status).toLowerCase();let k=s==='completed'||s==='active'||s==='connected'?'':s==='failed'||s==='rejected'?'failed':s.includes('approval')||s==='waiting'?'waiting':s==='paused'?'paused':'draft';return `<span class="status ${k}">${clean(status)}</span>`;}
function nav(page){if(page==='tenants'&&!isOwner())return toast('Platform Tenants requires Platform Owner.');state.page=page;state.mobileMenu=false;state.search='';render();}
function changeRole(role){state.role=role;if(!isOwner()){state.tenant='nexx';if(state.page==='tenants')state.page='overview';}state.selectedFlow=tenant().flows[0]?.id;state.selectedNode=0;log('Switched demo view to '+role);render();toast('Role preview: '+{owner:'Platform Owner',admin:'Organization Admin',operator:'Operator',viewer:'Viewer'}[role]);}
function changeTenant(id){if(!isOwner()&&id!=='nexx'){toast('Access denied: this role is scoped to Nexx AI.');return;}if(!byId(id))return;state.tenant=id;state.selectedFlow=tenant().flows[0]?.id;state.selectedNode=0;state.selectedRun=null;state.search='';render();toast('Workspace changed — data is isolated to '+tenant().name);}
function topbar(){document.getElementById('topbar').innerHTML=`<button class="btn tiny mobmenu" aria-label="Open menu" onclick="toggleMenu()">☰</button><div class="breadcrumbs">NEXX ORBIT <span style="color:#495570;padding:0 8px">/</span> ${isOwner()&&state.page==='tenants'?'Platform Control Plane':'Tenant Workspace'} <span style="color:#495570;padding:0 8px">/</span> <strong>${pages.find(x=>x[0]===state.page)?.[2]}</strong></div><div class="top-right"><span class="tenant-pill" title="Tenant-scoped workspace">◈ TENANT</span><select class="select" aria-label="Active tenant" onchange="changeTenant(this.value)">${tenants.filter(t=>isOwner()||t.id==='nexx').map(t=>`<option value="${t.id}" ${t.id===state.tenant?'selected':''}>${clean(t.name)}</option>`).join('')}</select><select class="select role" aria-label="Preview role" onchange="changeRole(this.value)"><option value="owner" ${state.role==='owner'?'selected':''}>Platform Owner</option><option value="admin" ${state.role==='admin'?'selected':''}>Org Admin</option><option value="operator" ${state.role==='operator'?'selected':''}>Operator</option><option value="viewer" ${state.role==='viewer'?'selected':''}>Viewer</option></select><div class="userpic" title="Demo user">NX</div></div>`;}
function sidebar(){document.getElementById('sidebar').className='sidebar'+(state.mobileMenu?' open':'');document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="mark">✳</div><div class="brandname">NEXX <small>ORBIT · AI OS</small></div></div><div class="environment"><div class="eyebrow">Active environment</div><div class="flex" style="margin-top:7px"><strong style="font-size:12px"><i class="tiny-dot"></i> Demo / Sandbox</strong><span class="tag">v0.1</span></div><div class="mini muted" style="margin-top:6px">${clean(tenant().slug)}.orbit.local</div></div><div class="side-group">Tenant Workspace</div><div class="nav">${pages.filter(x=>x[0]!=='tenants').map(([id,ic,label])=>`<button class="nav-link ${state.page===id?'active':''}" onclick="nav('${id}')"><span class="glyph">${ic}</span>${label}${id==='runs'&&tenant().runs.some(x=>x.status==='Awaiting approval')?`<small>●</small>`:''}</button>`).join('')}</div>${isOwner()?`<div class="side-group">Platform Control Plane</div><div class="nav"><button class="nav-link ${state.page==='tenants'?'active':''}" onclick="nav('tenants')"><span class="glyph">▦</span> Tenant Directory <small>${tenants.length}</small></button></div>`:''}<div class="side-bottom"><div class="eyebrow" style="margin-bottom:7px">Tenant boundary</div><strong>✓ Workspace isolation</strong><div class="mini" style="margin-top:5px">Switching workspaces replaces all tenant resources in this prototype.</div><button class="btn tiny ghost" style="margin-top:10px" onclick="nav('security')">Test isolation →</button></div>`;}
function header(kicker,title,desc,buttons=''){return `<div class="heading"><div><div class="overline">${kicker}</div><h1>${title}</h1><p class="lead">${desc}</p></div><div class="actions">${buttons}</div></div>`;}
function overview(){let t=tenant(),awaiting=t.runs.filter(r=>r.status==='Awaiting approval').length;let complete=t.runs.filter(r=>r.status==='Completed').length;let bars= [35,52,46,67,55,84,62,91,76,88,58,69].map((h,i)=>`<div class="bar" style="height:${Math.max(8,h*(0.4+t.used/t.budget*0.65))}%" title="Activity ${i+1}"></div>`).join('');return `${header('Tenant Workspace / Command Center','Good evening, Operator.','Operational visibility for '+clean(t.name)+'. All metrics below belong to this tenant.',`<button class="btn ghost" onclick="nav('runs')">View executions</button><button class="btn primary" ${canEdit()?'':'disabled'} onclick="openModal('flow')">＋ New workflow</button>`)}<div class="hero"><div class="overline">YOUR AI OPERATIONS HUB</div><h2>One mission. Many agents. Total control.</h2><p>Design dependable AI-driven workflows with deterministic checkpoints, human approvals, smart model routing, and tenant-scoped permissions.</p><div class="actions"><button class="btn primary" onclick="nav('studio')">Open Workflow Studio ↗</button><button class="btn" onclick="simulateRun('${t.flows[0]?.id}')" ${canEdit()?'':'disabled'}>▶ Run demo workflow</button></div></div><div class="grid cols4"><div class="panel metric"><div class="metric-icon">⬡</div><div class="metric-label">Total workflows</div><div class="metric-val">${t.flows.length}</div><div class="metric-foot">${t.flows.filter(f=>f.status==='active').length} published · Tenant scoped</div></div><div class="panel metric"><div class="metric-icon">✳</div><div class="metric-label">AI agents</div><div class="metric-val">${t.agents.length}</div><div class="metric-foot">Available in this workspace</div></div><div class="panel metric"><div class="metric-icon">◎</div><div class="metric-label">Executions</div><div class="metric-val">${t.runs.length}</div><div class="metric-foot">${complete} completed · ${awaiting} awaiting approval</div></div><div class="panel metric"><div class="metric-icon">◉</div><div class="metric-label">Usage / monthly budget</div><div class="metric-val">${money(t.used)} <span style="font-size:13px;color:#8d9cb8">/ ${money(t.budget)}</span></div><div class="progress" style="margin:10px 0 5px"><span style="width:${Math.min(100,t.used/t.budget*100)}%"></span></div><div class="metric-foot">Illustrative spend only</div></div></div><div class="spacer"></div><div class="grid cols2"><div class="panel"><div class="panel-head"><div><h3 class="section-title">Workflow portfolio</h3><p class="section-sub">Automations ready to inspect and run</p></div><button class="btn tiny ghost" onclick="nav('studio')">Open studio →</button></div>${t.flows.map(f=>`<div class="row-item" onclick="openFlow('${f.id}')"><div class="item-icon">⬡</div><div class="item-main"><strong>${clean(f.name)}</strong><span>${clean(f.description)}</span></div>${badge(f.status)}<span class="muted">↗</span></div>`).join('')}</div><div class="panel panel-pad"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="section-title">Execution activity</h3><span class="status">Demo telemetry</span></div><p class="section-sub">Illustrative volume profile for ${clean(t.name)}</p><div class="chart">${bars}</div><div class="chart-labels"><span>12h ago</span><span>9h</span><span>6h</span><span>3h</span><span>Now</span></div><hr class="divider"><div class="info-row"><span class="muted">Execution safety policy</span><strong>Approval required</strong></div><div class="info-row"><span class="muted">Current environment</span><strong>Sandbox</strong></div><div class="info-row"><span class="muted">Data partition</span><code>tenant_id=${clean(t.id)}</code></div></div></div><div class="spacer"></div><div class="grid cols2"><div class="panel"><div class="panel-head"><h3 class="section-title">Recent executions</h3><button class="btn tiny ghost" onclick="nav('runs')">See all →</button></div>${t.runs.length?t.runs.slice(0,4).map(r=>`<div class="row-item" onclick="nav('runs')"><div class="item-icon">▶</div><div class="item-main"><strong>${clean(r.flow)}</strong><span>Run ${r.id} · ${r.at}</span></div>${badge(r.status)}</div>`).join(''):`<div class="empty">No runs yet. Start a demo workflow to see traceable execution events.</div>`}</div><div class="panel panel-pad"><h3 class="section-title">Workspace guardrails</h3><p class="section-sub">Tenant-aware security modeled into the UX</p><div class="info-row"><span><span class="dot"></span>Tenant resources filtered</span><strong>Enabled in mock</strong></div><div class="info-row"><span><span class="dot"></span>Privilege-sensitive actions</span><strong>Role gated in mock</strong></div><div class="info-row"><span><span class="dot"></span>Approval checkpoint</span><strong>Simulated</strong></div><div class="info-row"><span><span class="dot"></span>Audit event capture</span><strong>Session only</strong></div><button class="btn tiny" onclick="nav('security')" style="margin-top:13px">Inspect security boundary →</button></div></div>`;}
function studio(){let t=tenant(),f=t.flows.find(x=>x.id===state.selectedFlow)||t.flows[0];if(!f)return `<div class="empty">Create a workflow to open the studio.</div>`;state.selectedFlow=f.id;let n=f.nodes[state.selectedNode]||f.nodes[0];return `${header('Build / Visual Canvas','Workflow Studio','Compose reliable agents and tools with approval gates and tenant-scoped resources.',`<button class="btn ghost" onclick="openModal('flow')" ${canEdit()?'':'disabled'}>＋ New workflow</button><button class="btn primary" onclick="simulateRun('${f.id}')" ${canEdit()?'':'disabled'}>▶ Run demo</button>`)}<div class="toolbar" style="margin-bottom:13px"><select class="select" style="min-width:270px" aria-label="Workflow" onchange="selectFlow(this.value)">${t.flows.map(q=>`<option value="${q.id}" ${q.id===f.id?'selected':''}>${clean(q.name)} (${q.status})</option>`).join('')}</select>${badge(f.status)}<button class="btn tiny" onclick="publishFlow('${f.id}')" ${canEdit()?'':'disabled'}>Publish workflow</button><button class="btn tiny" onclick="addNode()" ${canEdit()?'':'disabled'}>＋ Add step</button><span class="muted mini">Drag nodes to rearrange</span></div><div class="flow-layout"><div class="panel"><div class="panel-head"><div><h3 class="section-title">${clean(f.name)}</h3><p class="section-sub">${clean(f.description)}</p></div><span class="tag">5 core patterns · ${f.nodes.length} nodes</span></div><div class="canvas-scroll"><div class="canvas" id="flowCanvas"><svg class="wires" id="flowWires" width="1370" height="550" viewBox="0 0 1370 550"></svg>${f.nodes.map((q,i)=>`<div class="node ${q.type} ${i===state.selectedNode?'selected':''}" data-nid="${i}" style="left:${q.x}px;top:${q.y}px" onpointerdown="startDrag(event,${i})" onclick="pickNode(${i})"><div class="node-type"><span>${{trigger:'⚡',agent:'✳',model:'◈',approval:'◇',action:'⤴'}[q.type]||'◉'}</span>${clean(q.type)}</div><strong>${clean(q.name)}</strong><p>${clean(q.detail)}</p></div>`).join('')}</div></div><div class="panel-head"><div class="muted mini">Execution graph: trigger → planner → model → approval → action</div><span class="check-badge">● Valid demo topology</span></div></div><aside class="panel inspector"><div class="eyebrow">Node Inspector</div><h3>${clean(n.name)}</h3><p class="section-sub">Configure the selected execution step.</p><div class="field"><label>Node label</label><input id="nodeName" value="${clean(n.name)}" ${canEdit()?'':'disabled'} /></div><div class="field"><label>Step type</label><select id="nodeType" ${canEdit()?'':'disabled'}><option value="trigger" ${n.type==='trigger'?'selected':''}>Trigger</option><option value="agent" ${n.type==='agent'?'selected':''}>AI agent</option><option value="model" ${n.type==='model'?'selected':''}>Model gateway</option><option value="approval" ${n.type==='approval'?'selected':''}>Human approval</option><option value="action" ${n.type==='action'?'selected':''}>Tool action</option></select></div><div class="field"><label>Summary</label><input id="nodeDetail" value="${clean(n.detail)}" ${canEdit()?'':'disabled'} /></div><button class="btn primary" style="width:100%" onclick="saveNode()" ${canEdit()?'':'disabled'}>Save node changes</button><div class="notice">In production, node configuration also includes input/output schemas, retry policy, timeout, secret references, idempotency keys, and scoped permissions.</div></aside></div><div class="spacer"></div><div class="panel panel-pad"><h3 class="section-title">Execution settings</h3><div class="radios" style="margin:12px 0"><label><input type="radio" name="drymode" ${state.dryRun?'checked':''} onchange="state.dryRun=true"> Dry-run simulation</label><label><input type="radio" name="drymode" ${!state.dryRun?'checked':''} onchange="state.dryRun=false"> Live-like demo (still simulated)</label></div><label class="list-check"><input type="checkbox" ${f.needsApproval?'checked':''} onchange="setApproval('${f.id}',this.checked)" ${canEdit()?'':'disabled'}> Require approval before external tool action</label><p class="muted mini">No actual AI providers, GitHub APIs, credential vaults, or production execution engines are called in this prototype.</p></div>`;}
function selectFlow(id){state.selectedFlow=id;state.selectedNode=0;render();}function openFlow(id){state.selectedFlow=id;state.selectedNode=0;nav('studio');}function pickNode(i){if(state.selectedNode!==i){state.selectedNode=i;render();}}
function drawWires(){let f=tenant().flows.find(x=>x.id===state.selectedFlow);let svg=document.getElementById('flowWires');if(!f||!svg)return;svg.innerHTML='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#748ad0" stroke-width="1.5"/></marker></defs>'+f.nodes.slice(1).map((n,i)=>{let a=f.nodes[i];let x1=a.x+190,y1=a.y+52,x2=n.x,y2=n.y+52,mid=(x1+x2)/2;return `<path class="svg-arrow" marker-end="url(#arrow)" d="M ${x1} ${y1} C ${mid} ${y1},${mid} ${y2},${x2-8} ${y2}"/>`;}).join('');}
let drag=null;function startDrag(e,index){if(!canEdit()||e.button!==0)return;let f=tenant().flows.find(x=>x.id===state.selectedFlow),n=f?.nodes[index];if(!n)return;drag={id:index,x:e.clientX,y:e.clientY,oldX:n.x,oldY:n.y,moved:false};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=moveDrag;e.currentTarget.onpointerup=endDrag;e.currentTarget.onpointercancel=endDrag;}
function moveDrag(e){if(!drag)return;let f=tenant().flows.find(x=>x.id===state.selectedFlow),n=f?.nodes[drag.id];if(!n)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;n.x=Math.max(8,Math.min(1165,drag.oldX+dx));n.y=Math.max(12,Math.min(410,drag.oldY+dy));e.currentTarget.style.left=n.x+'px';e.currentTarget.style.top=n.y+'px';drawWires();}
function endDrag(e){if(!drag)return;let i=drag.id,moved=drag.moved;drag=null;e.currentTarget.onpointermove=null;e.currentTarget.onpointerup=null;e.currentTarget.onpointercancel=null;if(moved){state.selectedNode=i;document.querySelectorAll('.node').forEach((el,j)=>el.classList.toggle('selected',j===i));log('Repositioned workflow node');}else pickNode(i);}
function saveNode(){if(!canEdit())return;let f=tenant().flows.find(x=>x.id===state.selectedFlow),n=f.nodes[state.selectedNode];n.name=document.getElementById('nodeName').value.trim()||n.name;n.type=document.getElementById('nodeType').value;n.detail=document.getElementById('nodeDetail').value.trim();log('Updated step '+n.name,'workflow');render();toast('Node configuration saved to demo workspace.');}
function addNode(){if(!canEdit())return;let f=tenant().flows.find(x=>x.id===state.selectedFlow);f.nodes.push({id:uid(),x:535,y:355,type:'action',name:'New tool step',detail:'Configure tool action'});state.selectedNode=f.nodes.length-1;log('Added workflow node','workflow');render();toast('New tool step added. Drag to position it.');}
function publishFlow(id){if(!canEdit())return;let f=tenant().flows.find(x=>x.id===id);f.status='active';log('Published '+f.name,'workflow');render();toast('Workflow published in demo tenant.');}
function setApproval(id,value){let f=tenant().flows.find(x=>x.id===id);if(f&&canEdit()){f.needsApproval=value;log('Updated approval policy','workflow');toast(value?'Human approval enabled.':'Approval requirement removed in demo.');}}
function simulateRun(id){if(!canEdit())return toast('Viewer is read-only.');let t=tenant(),f=t.flows.find(x=>x.id===id);if(!f)return toast('Select a workflow first.');let run={id:'run_'+uid(),flow:f.name,flowId:id,status:f.needsApproval?'Awaiting approval':'Completed',at:new Date().toLocaleTimeString(),steps:[{name:'Trigger received',status:'Completed'},{name:'Plan generated',status:'Completed'},{name:'Model routed',status:'Completed'},{name:'Approval checkpoint',status:f.needsApproval?'Awaiting approval':'Bypassed'},{name:'Tool execution',status:f.needsApproval?'Pending':'Completed'}]};t.runs.unshift(run);f.runs++;t.used=Math.round((t.used+0.08)*100)/100;log('Started demo run '+run.id+' — '+run.status,'execution',t);state.selectedRun=run.id;state.page='runs';render();toast(run.status==='Awaiting approval'?'Execution paused for human approval.':'Demo execution completed.');}
function decideRun(id,approve){if(!canEdit())return;let r=tenant().runs.find(x=>x.id===id);if(!r||r.status!=='Awaiting approval')return;r.status=approve?'Completed':'Rejected';r.steps[3].status=approve?'Approved':'Rejected';r.steps[4].status=approve?'Completed':'Skipped';log((approve?'Approved':'Rejected')+' execution '+id,'approval');render();toast(approve?'Approved: run completed (simulated).':'Run rejected and stopped.');}
function agents(){let t=tenant();return `${header('Build / Workforce','Agent Studio','Design and manage AI specialists inside '+clean(t.name)+'.',`<button class="btn primary" ${canEdit()?'':'disabled'} onclick="openModal('agent')">＋ Create agent</button>`)}<div class="grid cols3">${t.agents.map(a=>`<div class="panel agent-card"><div style="display:flex;justify-content:space-between"><div class="avatar">✳</div>${badge('active')}</div><h3>${clean(a.name)}</h3><p>${clean(a.desc)}</p><hr class="divider"><div class="cards-lines"><div class="mini"><span>Specialty</span><strong>${clean(a.type)}</strong></div><div class="mini"><span>Default model</span><strong>${clean(a.model)}</strong></div><div class="mini"><span>Tenant scope</span><strong>${clean(t.slug)}</strong></div></div><div class="actions" style="margin-top:17px"><button class="btn tiny" onclick="inspectAgent('${a.id}')">Inspect agent</button><button class="btn tiny ghost" onclick="openFlow('${t.flows[0]?.id}')">Use in workflow ↗</button></div></div>`).join('')}<button class="panel agent-card" style="min-height:220px;border:1px dashed #54617b;background:#111a2a;color:#afbcdb;text-align:center" ${canEdit()?'':'disabled'} onclick="openModal('agent')"><span style="font-size:36px;color:#a38afa">＋</span><h3>Create AI agent</h3><p>Give it a role, model and scoped tools</p></button></div><div class="spacer"></div><div class="panel panel-pad"><h3 class="section-title">Agent permission design</h3><p class="muted">Each agent will have explicit tool allowlists, model policies, per-run budgets, credential references and approval requirements. Agent identity must always be bound to the organization and execution context.</p></div>`;}
function inspectAgent(id){let a=tenant().agents.find(x=>x.id===id);if(a)toast(`${a.name} · ${a.type} · ${a.model} · demo agent configuration`);}
function runs(){let t=tenant(),r=t.runs.find(x=>x.id===state.selectedRun)||t.runs[0];return `${header('Operate / Run History','Executions','Inspect simulated execution traces, human checkpoints, and outcomes.',`<button class="btn primary" ${canEdit()?'':'disabled'} onclick="simulateRun('${t.flows[0]?.id}')">▶ Run sample</button>`)}<div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr)"><div class="panel"><div class="panel-head"><h3 class="section-title">Recent executions</h3><span class="tag">Tenant: ${clean(t.slug)}</span></div>${t.runs.length?t.runs.map(x=>`<div class="row-item" style="background:${r?.id===x.id?'#222844':''}" onclick="chooseRun('${x.id}')"><div class="item-icon">▶</div><div class="item-main"><strong>${clean(x.flow)}</strong><span>${x.id} · ${x.at}</span></div>${badge(x.status)}</div>`).join(''):`<div class="empty">Nothing has executed in this workspace.<br><button class="btn tiny" style="margin-top:13px" onclick="simulateRun('${t.flows[0]?.id}')" ${canEdit()?'':'disabled'}>Run first simulation</button></div>`}</div><div class="panel panel-pad"><h3 class="section-title">Execution Inspector</h3>${r?`<p class="section-sub">${clean(r.id)} · ${clean(r.flow)}</p><div style="margin:15px 0">${badge(r.status)}</div>${r.steps.map((s,i)=>`<div class="info-row"><span class="mini">${i+1}. ${clean(s.name)}</span>${badge(s.status)}</div>`).join('')}${r.status==='Awaiting approval'?`<div class="alert" style="margin-top:15px">This action is awaiting a human review. The downstream tool step has not executed.</div><div class="actions" style="margin-top:13px"><button class="btn green" ${canEdit()?'':'disabled'} onclick="decideRun('${r.id}',true)">✓ Approve</button><button class="btn red" ${canEdit()?'':'disabled'} onclick="decideRun('${r.id}',false)">✕ Reject</button></div>`:''}<button class="btn tiny ghost" style="margin-top:15px" onclick="copyRun('${r.id}')">Copy run reference</button>`:`<p class="muted" style="margin-top:30px">Select or start an execution to inspect its nodes, event timeline and human checkpoint.</p>`}</div></div><div class="spacer"></div><div class="panel panel-pad"><h3 class="section-title">Production execution contract</h3><p class="muted">Real workflow runs require a durable event log, idempotency keys, trace spans, retry/backoff, cancellation, compensating actions, and tenant-scoped storage. This prototype only simulates these states.</p></div>`;}
function chooseRun(id){state.selectedRun=id;render();}function copyRun(id){navigator.clipboard?.writeText(id).then(()=>toast('Run ID copied.')).catch(()=>toast('Run reference: '+id));}
function integrations(){let t=tenant();let icons={GitHub:'⌘',Neon:'◈',Vercel:'▲','Google Drive':'△','MCP Server':'⬡',Webhooks:'⤴'};return `${header('Connect / Tools','Integration Hub','Connect and govern tenant-owned external systems. No actual credentials are collected here.') }<div class="grid cols3">${Object.entries(t.integrations).map(([n,on])=>`<div class="panel panel-pad"><div style="display:flex;justify-content:space-between"><span class="integration-icon">${icons[n]}</span>${badge(on?'connected':'draft')}</div><h3 style="margin:15px 0 4px;font-size:16px">${n}</h3><p class="muted mini">Scoped connection for ${clean(t.slug)}.</p><hr class="divider"><div class="info-row"><span class="muted mini">Credential access</span><strong class="mini">Scoped vault ref</strong></div><div class="info-row"><span class="muted mini">Environment</span><strong class="mini">Sandbox</strong></div><button class="btn tiny ${on?'ghost':'primary'}" style="margin-top:13px" onclick="toggleIntegration('${n}')" ${canGovern()?'':'disabled'}>${on?'Disconnect demo':'Connect demo'}</button></div>`).join('')}</div><div class="spacer"></div><div class="alert">Security model: tools are authorized per tenant and agent. Production credentials must be stored in a secret manager, never in workflow nodes, browser storage or shared database rows.</div>`;}
function toggleIntegration(n){if(!canGovern())return toast('Org Admin or Platform Owner required.');let t=tenant();t.integrations[n]=!t.integrations[n];log((t.integrations[n]?'Enabled':'Disabled')+' '+n+' demo connector','integration');render();toast(n+' connector updated in demo only.');}
function billing(){let t=tenant(),perc=Math.min(100,Math.round(t.used/t.budget*100));return `${header('Monitor / FinOps','Usage & Billing','Per-tenant AI spend, provider utilization and budget guardrails.',`<button class="btn ghost" ${canGovern()?'':'disabled'} onclick="openModal('budget')">Edit budget</button>`)}<div class="grid cols3"><div class="panel metric"><div class="metric-icon">＄</div><div class="metric-label">Demo month-to-date usage</div><div class="metric-val">${money(t.used)}</div><div class="metric-foot">Includes simulated executions</div></div><div class="panel metric"><div class="metric-icon">◎</div><div class="metric-label">Monthly budget</div><div class="metric-val">${money(t.budget)}</div><div class="metric-foot">${perc}% used</div></div><div class="panel metric"><div class="metric-icon">◆</div><div class="metric-label">Subscription tier</div><div class="metric-val">${clean(t.plan)}</div><div class="metric-foot">Billing is illustrative, no payment provider</div></div></div><div class="spacer"></div><div class="grid cols2"><div class="panel panel-pad"><h3 class="section-title">Budget consumption</h3><p class="section-sub">Hard stops or alerts should be enforced on the backend.</p><div style="font-size:24px;font-weight:800;margin:24px 0 15px">${perc}% <span class="muted mini">consumed</span></div><div class="progress"><span style="width:${perc}%"></span></div><div class="info-row"><span class="muted">Consumed</span><strong>${money(t.used)}</strong></div><div class="info-row"><span class="muted">Remaining</span><strong>${money(Math.max(0,t.budget-t.used))}</strong></div><div class="info-row"><span class="muted">Tenant isolation</span><strong>${clean(t.slug)}</strong></div></div><div class="panel panel-pad"><h3 class="section-title">Model gateway allocation</h3><p class="section-sub">Example configurable routing weights</p>${[['GPT-6',48],['DeepSeek',30],['Qwen',17],['Other',5]].map(([n,v])=>`<div style="margin:17px 0"><div class="info-row" style="padding:0 0 7px"><span>${n}</span><strong>${v}%</strong></div><div class="progress"><span style="width:${v}%"></span></div></div>`).join('')}</div></div>`;}
function security(){let t=tenant();let other=tenants.find(x=>x.id!==t.id);let allowed={owner:'Platform administration, tenant administration and workflow execution',admin:'Own organization: agents, workflows, connectors, staff and budgets',operator:'Own organization: workflows, agents and executions',viewer:'Own organization: read-only resources'};return `${header('Govern / Zero Trust','Security & Access','Role-aware workspace controls and an interactive cross-tenant access check.') }<div class="grid cols2"><div class="panel panel-pad"><h3 class="section-title">Current access context</h3><p class="section-sub">Role and tenant determine every authorized action.</p><div class="info-row"><span class="muted">Role</span><strong>${{owner:'Platform Owner',admin:'Org Admin',operator:'Operator',viewer:'Viewer'}[state.role]}</strong></div><div class="info-row"><span class="muted">Active tenant</span><strong>${clean(t.slug)}</strong></div><div class="info-row"><span class="muted">Can mutate workspace</span>${badge(canEdit()?'Active':'Paused')}</div><div class="info-row"><span class="muted">Can manage connections</span><strong>${canGovern()?'Yes':'No'}</strong></div><div class="info-row"><span class="muted">Can open platform directory</span><strong>${isOwner()?'Yes':'No'}</strong></div><p class="muted mini" style="margin-top:15px">${allowed[state.role]}.</p></div><div class="panel panel-pad"><h3 class="section-title">Tenant Isolation Lab</h3><p class="section-sub">Try to access data from another tenant as a tenant-bound service identity.</p><div class="field"><label>Acting identity</label><input value="service-account@${clean(t.slug)}" disabled></div><div class="field"><label>Attempted target</label><input value="${clean(other.slug)} / workflows" disabled></div><div class="field"><label>Policy</label><input value="resource.tenant_id == principal.tenant_id" disabled></div><button class="btn primary" onclick="isolationTest()">Run cross-tenant denial test</button><div id="isolationResult" class="notice" style="display:none"></div></div></div><div class="spacer"></div><div class="panel panel-pad"><h3 class="section-title">Required production guarantees</h3><p class="muted">Enforce membership and role checks at the API, workload runner, database RLS and object storage. Every run, job, memory item, vector index, event and secret reference must have a tenant scope. Separate platform access from organization access, use short-lived credentials, signed tool calls, and auditable elevation. UI restrictions alone are not security.</p><div class="code">principal = { tenant_id, subject_id, role, permissions }\nauthorize(principal, action, resource)\nassert(resource.tenant_id === principal.tenant_id)\n// Platform administration uses separate audited authorization.</div></div>`;}
function isolationTest(){let other=tenants.find(x=>x.id!==state.tenant);log('Denied attempted read of '+other.slug+'/workflows: 403','access-denied');let el=document.getElementById('isolationResult');if(el){el.style.display='block';el.innerHTML='<strong style="color:#ffafb8">403 · Forbidden (simulated)</strong><div style="margin-top:5px">Access blocked: acting identity is scoped to <code>'+clean(tenant().slug)+'</code>, not <code>'+clean(other.slug)+'</code>. Event added to the audit log.</div>';}toast('Cross-tenant access denied in simulated policy.');}
function audit(){let t=tenant();return `${header('Govern / Evidence','Audit Trail','Tenant-scoped history of simulated administrative and workflow activity.') }<div class="panel"><div class="panel-head"><h3 class="section-title">Session events</h3><span class="tag">Not persisted outside this browser session</span></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Resource</th><th>Event</th></tr></thead><tbody>${t.audit.length?t.audit.map(a=>`<tr><td class="nowrap">${a.at}</td><td>${clean(a.actor)}</td><td>${clean(a.resource)}</td><td><strong>${clean(a.message)}</strong></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">No audit events yet. Try running a workflow, switching role, or testing tenant isolation.</div></td></tr>`}</tbody></table></div></div><div class="spacer"></div><div class="alert">Production events must be append-only, tamper-evident, tenant-indexed, time-stamped, and searchable without exposing sensitive inputs or other organizations’ records.</div>`;}
function tenantPage(){if(!isOwner())return security();let totalFlows=tenants.reduce((n,t)=>n+t.flows.length,0);return `${header('Platform / SaaS Control Plane','Tenant Directory','Manage subscriptions, onboarding and organizational boundaries from the platform layer.',`<button class="btn primary" onclick="openModal('tenant')">＋ Provision demo tenant</button>`)}<div class="grid cols4"><div class="panel metric"><div class="metric-icon">▦</div><div class="metric-label">Organizations</div><div class="metric-val">${tenants.length}</div><div class="metric-foot">Includes seeded demo tenants</div></div><div class="panel metric"><div class="metric-icon">♙</div><div class="metric-label">Seats across tenants</div><div class="metric-val">${tenants.reduce((n,t)=>n+t.users,0)}</div><div class="metric-foot">Platform-level aggregate</div></div><div class="panel metric"><div class="metric-icon">⬡</div><div class="metric-label">Workflows across tenants</div><div class="metric-val">${totalFlows}</div><div class="metric-foot">Control-plane metadata only</div></div><div class="panel metric"><div class="metric-icon">＄</div><div class="metric-label">Total tenant demo usage</div><div class="metric-val">${money(tenants.reduce((n,t)=>n+t.used,0))}</div><div class="metric-foot">Illustrative metering</div></div></div><div class="spacer"></div><div class="panel"><div class="panel-head"><div><h3 class="section-title">Organizations</h3><p class="section-sub">Switch to inspect each organization's isolated workspace</p></div><span class="tag">Control plane</span></div><div class="table-wrap"><table><thead><tr><th>Organization</th><th>Tenant ID</th><th>Tier</th><th>Users</th><th>Workflows</th><th>Usage</th><th>Action</th></tr></thead><tbody>${tenants.map(t=>`<tr><td><strong>${clean(t.name)}</strong></td><td><code>${clean(t.slug)}</code></td><td>${clean(t.plan)}</td><td>${t.users}</td><td>${t.flows.length}</td><td>${money(t.used)}</td><td><button class="btn tiny" onclick="enterTenant('${t.id}')">Open workspace →</button></td></tr>`).join('')}</tbody></table></div></div><div class="spacer"></div><div class="grid cols2"><div class="panel panel-pad"><h3 class="section-title">SaaS tenant lifecycle</h3><div class="info-row"><span>1. Provision organization</span><span class="tag">Control plane</span></div><div class="info-row"><span>2. Assign owner + workspace</span><span class="tag">Identity</span></div><div class="info-row"><span>3. Apply quotas and model policies</span><span class="tag">FinOps</span></div><div class="info-row"><span>4. Isolate secrets, data and jobs</span><span class="tag">Security</span></div><div class="info-row"><span>5. Meter usage and audit actions</span><span class="tag">Governance</span></div></div><div class="panel panel-pad"><h3 class="section-title">Platform vs tenant plane</h3><p class="muted">The Platform Control Plane provisions and bills organizations, manages plans, and monitors fleet health. The Tenant Data Plane hosts organization-specific agent definitions, runs, tools, memory, approvals, and logs. Platform operators should not receive routine unrestricted access to tenant data or credentials.</p><div class="notice">This design models both planes visually. It does not actually create cloud resources, databases, or accounts.</div></div></div>`;}
function enterTenant(id){changeTenant(id);nav('overview');}
function openModal(type){if(type==='tenant'&&!isOwner())return toast('Platform Owner required.');if(type==='budget'&&!canGovern())return toast('Insufficient permission.');if(!canEdit()&&type!=='tenant')return toast('Viewer is read-only.');state.modal=type;renderModal();}
function closeModal(){state.modal=null;document.getElementById('modalRoot').innerHTML='';}
function renderModal(){if(!state.modal){document.getElementById('modalRoot').innerHTML='';return;}let m=state.modal;let config={flow:['Create workflow','Create a tenant-scoped execution graph.','Workflow name','Research Automation'],agent:['Create AI Agent','Register an AI specialist inside this organization.','Agent name','Verification Agent'],tenant:['Provision tenant','Create a new isolated demo organization.','Organization name','New Organization'],budget:['Monthly spend limit','Set a demo spending limit for this organization.','Budget (USD)',String(tenant().budget)]}[m];document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="submitModal(event)"><div class="eyebrow">NEXX Orbit · Demo action</div><h2>${config[0]}</h2><p>${config[1]} This action modifies local prototype state only.</p><div class="field"><label for="modalMain">${config[2]}</label><input id="modalMain" required maxlength="75" value="${clean(config[3])}" ${m==='budget'?'type="number" min="1" step="1"':'type="text"'}></div>${m==='agent'?`<div class="field"><label for="modalSecond">Default model</label><select id="modalSecond"><option>GPT-6</option><option>DeepSeek</option><option>Qwen</option><option>Gemini</option></select></div>`:''}${m==='tenant'?`<div class="field"><label for="modalSecond">Subscription tier</label><select id="modalSecond"><option>Starter</option><option>Growth</option><option>Scale</option></select></div>`:''}<div class="buttons"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">${m==='budget'?'Save limit':'Create in demo'}</button></div></form></div>`;setTimeout(()=>document.getElementById('modalMain')?.focus(),0);}
function submitModal(e){e.preventDefault();let m=state.modal,main=document.getElementById('modalMain').value.trim(),secondary=document.getElementById('modalSecond')?.value;if(!main)return;if(m==='flow'){let f=seedFlow('f_'+uid(),main,'New tenant-scoped orchestration workflow','draft');tenant().flows.unshift(f);state.selectedFlow=f.id;state.selectedNode=0;state.page='studio';log('Created '+f.name,'workflow');}if(m==='agent'){tenant().agents.push({id:uid(),name:main,type:'Custom',model:secondary,desc:'New specialist ready for configuration.'});state.page='agents';log('Created '+main,'agent');}if(m==='budget'){tenant().budget=Number(main);state.page='billing';log('Updated monthly budget to '+money(main),'billing');}if(m==='tenant'){let id='org_'+uid(),slug=main.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,42)||id;tenants.push({id,name:main,slug:slug+'-'+id.slice(-4),plan:secondary,users:1,budget:100,used:0,agents:[],flows:[],integrations:{GitHub:false,Neon:false,Vercel:false,'Google Drive':false,'MCP Server':false,Webhooks:false},runs:[],audit:[]});state.page='tenants';log('Created demo tenant '+main,'tenant');}closeModal();render();toast('Saved to local demonstration state. No server was changed.');}
function toggleMenu(){state.mobileMenu=!state.mobileMenu;sidebar();}
function render(){topbar();sidebar();let body={overview,studio,agents,runs,integrations,billing,security,audit,tenants:tenantPage}[state.page]();document.getElementById('content').innerHTML=body+`<div class="page-footer">NEXX ORBIT · INTERACTIVE PRODUCT DESIGN / SANDBOX PROTOTYPE · Synthetic data, no backend or real AI execution</div>`;if(state.page==='studio')drawWires();if(state.modal)renderModal();}
// Demo state remains isolated in memory; production implementation must enforce isolation on the server.
render();
</script>
</body>
